name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

concurrency:
  group: release
  cancel-in-progress: false   # never cancel a half-finished publish

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # NuGet OIDC login + provenance attestation
      packages: write       # push to GitHub Packages
      attestations: write   # actions/attest-build-provenance

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Extract and validate version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not produce a valid SemVer version ('$VERSION')."
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: |
          dotnet build --no-restore -c Release \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack Palworld.RestClient/Palworld.RestClient.csproj \
            --no-build -c Release \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o ./artifacts

          dotnet pack Palworld.RestClient.Extensions.DependencyInjection/Palworld.RestClient.Extensions.DependencyInjection.csproj \
            --no-build -c Release \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o ./artifacts

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: NuGet login (OIDC temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_ARGS=""
          if [[ "${{ steps.version.outputs.PRERELEASE }}" == "true" ]]; then
            EXTRA_ARGS="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            ./artifacts/*.nupkg ./artifacts/*.snupkg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $EXTRA_ARGS
